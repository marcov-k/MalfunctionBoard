name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target-framework: net10.0-windows10.0.19041.0
            rid: win-x64
            asset-suffix: win

          - os: macos-latest
            target-framework: net10.0-maccatalyst
            rid: maccatalyst-arm64
            asset-suffix: mac-arm64

          - os: macos-latest
            target-framework: net10.0-maccatalyst
            rid: maccatalyst-x64
            asset-suffix: mac-x64
            
            
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Publish
        run: >
          dotnet publish
          MalfunctionBoard/MalfunctionBoard.csproj
          -c Release
          -f ${{ matrix.target-framework }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:CreateAppBundle=true
          -o publish

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}".TrimStart("v")

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DApplicationVersion=$Version" `
            "/DPublishDir=$env:GITHUB_WORKSPACE\publish" `
            "$env:GITHUB_WORKSPACE\installer\MalfunctionBoard.iss"

          $Installer = "$env:GITHUB_WORKSPACE\installer\output\MalfunctionBoard-${{ github.ref_name }}-win.exe"

          if (-not (Test-Path $Installer)) {
            Write-Error "Windows installer was not created: $Installer"
            exit 1
          }

          Write-Host "Created installer:"
          Write-Host $Installer

      - name: Package Mac Catalyst
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}"

          $Pkg = Get-ChildItem "publish" -Filter "*.pkg" |
            Select-Object -First 1

          New-Item -ItemType Directory -Force "release" | Out-Null
          Copy-Item $Pkg.FullName "release/MalfunctionBoard-$Version-${{ matrix.asset-suffix }}.pkg" -Force

      - name: Upload Windows release package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MalfunctionBoard-${{ matrix.asset-suffix }}
          path: installer/output/MalfunctionBoard-${{ github.ref_name }}-win.exe

      - name: Upload Mac Catalyst release package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MalfunctionBoard-${{ matrix.asset-suffix }}
          path: release/MalfunctionBoard-${{ github.ref_name }}-${{ matrix.asset-suffix }}.pkg

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Show downloaded files
        run: find release -type f

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MalfunctionBoard ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/**/MalfunctionBoard-${{ github.ref_name }}-win.exe
            release/**/MalfunctionBoard-${{ github.ref_name }}-mac-arm64.pkg
            release/**/MalfunctionBoard-${{ github.ref_name }}-mac-x64.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
