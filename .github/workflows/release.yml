name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target-framework: net10.0-windows10.0.19041.0
            rid: win-x64
            asset-suffix: win

          - os: macos-latest
            target-framework: net10.0-maccatalyst
            rid: maccatalyst-arm64
            asset-suffix: mac-arm64

          - os: macos-latest
            target-framework: net10.0-maccatalyst
            rid: maccatalyst-x64
            asset-suffix: mac-x64
            
            
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Publish
        run: >
          dotnet publish
          MalfunctionBoard/MalfunctionBoard.csproj
          -c Release
          -f ${{ matrix.target-framework }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:CreateAppBundle=true
          -o publish

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}"
          $Package = "release/MalfunctionBoard"

          New-Item -ItemType Directory -Force $Package | Out-Null

          Copy-Item "publish/*" $Package -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE/LICENSE" "release/"

          $TargetFile = Join-Path $Package "MalfunctionBoard.exe"
          $ShortcutFile = "release/MalfunctionBoard.lnk"

          $WScriptShell = New-Object -ComObject WScript.Shell
          $Shortcut = $WScriptShell.CreateShortcut($ShortcutFile)
          $Shortcut.TargetPath = $TargetFile
          $Shortcut.WorkingDirectory = $Package
          $Shortcut.Save()

          Compress-Archive `
            -Path "release/MalfunctionBoard", "release/LICENSE", "release/MalfunctionBoard.lnk" `
            -DestinationPath "MalfunctionBoard-$Version-${{ matrix.asset-suffix }}.zip" `
            -Force

      - name: Package Mac Catalyst
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}"
          $Package = "release/MalfunctionBoard"

          New-Item -ItemType Directory -Force $Package | Out-Null

          $Pkg = Get-ChildItem "publish" -Filter "*.pkg" |
            Select-Object -First 1

          if (-not $Pkg)
          {
            Write-Host "Contents of publish:"
            Get-ChildItem "publish" -Recurse

            throw "No .pkg installer foudn in publish/"
          }

          Copy-Item $Pkg.FullName $Package -Force
          Copy-Item "$env:GITHUB_WORKSPACE/LICENSE" "$Package/"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: MalfunctionBoard-${{ matrix.asset-suffix }}
          path: MalfunctionBoard-${{ github.ref_name }}-${{ matrix.asset-suffix }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Show downloaded files
        run: find release -type f

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MalfunctionBoard ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/**/MalfunctionBoard-${{ github.ref_name }}-win.zip
            release/**/MalfunctionBoard-${{ github.ref_name }}-mac-arm64.zip
            release/**/MalfunctionBoard-${{ github.ref_name }}-mac-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
