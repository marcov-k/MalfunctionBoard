name: Publish Vendordep

on:
  push:
    tags:
      - "nt-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#nt-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and publish artifacts to local repo
        working-directory: wpilib-nt
        env:
          VENDOR_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew publish

      - name: Update vendordep JSON version fields
        working-directory: wpilib-nt
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" \
            '.version = $v | .javaDependencies[0].version = $v' \
            MalfunctionBoardNT.json > tmp.json
          mv tmp.json MalfunctionBoardNT.json

      - name: Commit updated repo and vendordep JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publish-repo wpilib-nt/MalfunctionBoardNT.json
          git commit -m "Publish malfunctionboard-nt ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub release for Java package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MalfunctionBoard NT ${{ steps.version.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
